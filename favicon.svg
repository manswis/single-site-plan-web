<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blueprintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#004bb5"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Apple Rounded Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#blueprintGrad)"/>

  <!-- Subtle Blueprint Grid lines -->
  <path d="M8 32h48M32 8v48" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Architectural Pediment / Roof Structure -->
  <path d="M32 14 L14 24 L50 24 Z" fill="#ffffff"/>

  <!-- Classical Sanction Columns (3 Pillars) -->
  <rect x="18" y="27" width="5" height="19" rx="1.5" fill="#ffffff"/>
  <rect x="29.5" y="27" width="5" height="19" rx="1.5" fill="#ffffff"/>
  <rect x="41" y="27" width="5" height="19" rx="1.5" fill="#ffffff"/>

  <!-- Plinth / Base Foundation -->
  <rect x="13" y="47" width="38" height="5" rx="1.5" fill="#ffffff"/>

  <!-- CAD Drafting Compass Accent (Golden Floating Badge) -->
  <circle cx="48" cy="48" r="11" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="48" cy="48" r="9" fill="url(#goldGrad)"/>
  <path d="M48 41 L43 53 M48 41 L53 53 M45 49 h6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
</svg>
