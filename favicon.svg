  <!-- Plot Corner Points -->
  <circle cx="14" cy="14" r="2" fill="#38bdf8"/>
  <circle cx="50" cy="14" r="2" fill="#38bdf8"/>
  <circle cx="50" cy="50" r="2" fill="#38bdf8"/>
  <circle cx="14" cy="50" r="2" fill="#38bdf8"/>
