  <path d="M12 16h40M12 24h40M12 32h40M12 40h40M12 48h40" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <path d="M16 12v40M24 12v40M32 12v40M40 12v40M48 12v40" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- Outer Plot Boundary (Sky Blue Dashed) -->
  <rect x="14" y="14" width="36" height="36" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,3"/>
  
  <!-- Proposed Building Footprint (Gold) -->
  <rect x="22" y="22" width="20" height="20" rx="2" fill="rgba(245, 158, 11, 0.25)" stroke="#f59e0b" stroke-width="2"/>
  
